name: Monday League Notifications

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  monday-league-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Process Monday League notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            "https://app.movipadel.it/api/cron/monday-league-notifications"
